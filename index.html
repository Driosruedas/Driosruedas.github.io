    <link rel="icon" href="/favicon.ico" sizes="48x48 96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600&family=Syne:wght@700&display=swap" />

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "David Ríos Ruedas Audiovisuales",
        "alternateName": ["David Ríos Ruedas", "DRR Audiovisuales"],
        "url": "https://driosruedas.github.io/"
    }
    </script>

    <style>
        :root {
            --ink: #14211f;
            --muted: #64716d;
            --paper: #f5f1ea;
            --paper-deep: #e9e3d9;
            --accent: #e8b744;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Manrope', system-ui, sans-serif;
        }

        main {
            display: grid;
            gap: 26px;
            justify-items: start;
            max-width: 620px;
        }

        .mark {
            width: 56px;
            height: 56px;
        }

        .eyebrow {
            margin: 0;
            color: var(--muted);
            font: 11px 'DM Mono', monospace;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font: 700 clamp(3rem, 11vw, 6.2rem)/.94 'Syne', sans-serif;
            letter-spacing: -.05em;
        }

        h1 span { color: var(--accent); }

        p.lead {
            max-width: 460px;
            margin: 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        a.button {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            min-height: 50px;
            padding: 0 22px;
            background: var(--ink);
            color: #fffdf9;
            font: 11px 'DM Mono', monospace;
            letter-spacing: .07em;
            text-decoration: none;
            text-transform: uppercase;
            transition: background .2s ease, color .2s ease;
        }

        a.button:hover,
        a.button:focus-visible {
            background: var(--accent);
            color: var(--ink);
        }
    </style>
</head>

<body>
    <main>
        <img class="mark" src="/favicon.svg" alt="" width="56" height="56" />
        <p class="eyebrow">Editor de vídeo · Creación audiovisual con IA</p>
        <h1>David Ríos<br /><span>Ruedas</span></h1>
        <p class="lead">Vídeos para marcas, productos, YouTube, redes sociales y publicidad. Edición en Premiere y After Effects con IA generativa.</p>
        <a class="button" href="/david-rios-ruedas-audiovisuales/">Ver portfolio <span aria-hidden="true">→</span></a>
    </main>
</body>

</html>
